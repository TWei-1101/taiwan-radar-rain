configuration:
  location_name:
    name: First location name
    description: Display name for the first coordinate pair.
  latitude:
    name: First location latitude
    description: Latitude of the first location to monitor.
  longitude:
    name: First location longitude
    description: Longitude of the first location to monitor.
  location_2_enabled:
    name: Enable second location
    description: Monitor a second coordinate pair.
  location_2_name:
    name: Second location name
    description: Display name for the second coordinate pair.
  latitude_2:
    name: Second location latitude
    description: Required when the second location is enabled.
  longitude_2:
    name: Second location longitude
    description: Required when the second location is enabled.
  location_3_enabled:
    name: Enable third location
    description: Monitor a third coordinate pair.
  location_3_name:
    name: Third location name
    description: Display name for the third coordinate pair.
  latitude_3:
    name: Third location latitude
    description: Required when the third location is enabled.
  longitude_3:
    name: Third location longitude
    description: Required when the third location is enabled.
  rain_threshold_dbz:
    name: Rain threshold
    description: Minimum radar reflectivity in dBZ treated as rain.
  incoming_radius_km:
    name: Incoming rain radius
    description: Radius in kilometres used to search for approaching rain.
  interval_seconds:
    name: Update interval
    description: Seconds between radar checks; CWA data normally updates every 10 minutes.
  history_frames:
    name: Radar history frames
    description: Number of recent frames used for movement estimation.
  log_level:
    name: Log level
    description: Verbosity of application logs.
