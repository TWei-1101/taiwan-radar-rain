configuration:
  location_name:
    name: 第一個位置名稱
    description: 第一組經緯度在 Home Assistant 顯示的名稱。
  latitude:
    name: 第一個位置緯度
    description: 第一個監測位置的緯度。
  longitude:
    name: 第一個位置經度
    description: 第一個監測位置的經度。
  location_2_enabled:
    name: 啟用第二個位置
    description: 開啟第二組位置監測。
  location_2_name:
    name: 第二個位置名稱
    description: 第二組經緯度在 Home Assistant 顯示的名稱。
  latitude_2:
    name: 第二個位置緯度
    description: 啟用第二個位置時必須填寫。
  longitude_2:
    name: 第二個位置經度
    description: 啟用第二個位置時必須填寫。
  location_3_enabled:
    name: 啟用第三個位置
    description: 開啟第三組位置監測。
  location_3_name:
    name: 第三個位置名稱
    description: 第三組經緯度在 Home Assistant 顯示的名稱。
  latitude_3:
    name: 第三個位置緯度
    description: 啟用第三個位置時必須填寫。
  longitude_3:
    name: 第三個位置經度
    description: 啟用第三個位置時必須填寫。
  rain_threshold_dbz:
    name: 降雨門檻
    description: 判定為降雨的最低雷達回波強度（dBZ）。
  incoming_radius_km:
    name: 接近雨區搜尋半徑
    description: 搜尋接近雨區的半徑，單位為公里。
  interval_seconds:
    name: 更新間隔
    description: 雷達檢查間隔秒數；中央氣象署資料通常每 10 分鐘更新。
  history_frames:
    name: 雷達歷史幀數
    description: 用於估算雨區移動的最近雷達幀數。
  log_level:
    name: 紀錄層級
    description: App 執行紀錄的詳細程度。
