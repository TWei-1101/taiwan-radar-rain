[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taiwan-radar-rain"
version = "0.1.0"
description = "CWA radar rain detection and Home Assistant MQTT sensors"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "httpx[socks]>=0.27,<1",
  "numpy>=2.0,<3",
  "paho-mqtt>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
radar-rain = "radar_rain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_rain"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
